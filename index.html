<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

</head>

        <h1>AMIR PRO</h1>

        <hr style="border: 0.5px solid #333;">
        <p>«لگ، خط قرمز ماست!»</p>
    </div>
</body>
</html>
