<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIR ASHJAEE | Official Web</title>
    <style>
        :root { --main: #00ff7f; --dark-1: #0a0a0a; --dark-2: #151515; --silver: #e0e0e0; }
        body { background-color: var(--dark-1); color: var(--silver); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* هدر شیشه‌ای */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,255,127,0.3); sticky: top; z-index: 1000; }
        .acc-id { font-family: 'Courier New', monospace; color: var(--main); font-weight: bold; font-size: 1rem; border: 1px solid var(--main); padding: 5px 12px; border-radius: 5px; }
        .profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; border-radius: 12px; border: 2px solid var(--main); box-shadow: 0 0 15px rgba(0,255,127,0.4); }

        /* بخش اصلی */
        .hero { text-align: center; padding: 100px 20px; background: radial-gradient(circle at center, rgba(0,255,127,0.08) 0%, transparent 70%); }
        .status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; background: rgba(0,255,127,0.1); padding: 5px 15px; border-radius: 20px; color: var(--main); margin-bottom: 20px; border: 1px solid rgba(0,255,127,0.2); }
        .dot { width: 8px; height: 8px; background: var(--main); border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        h1 { font-size: 3.5rem; margin: 0; color: #fff; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .name-farsi { font-size: 1.5rem; color: var(--main); margin-top: 10px; font-weight: 100; }

        /* دکمه‌های جدید */
        .social-btns { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        .s-btn { padding: 14px 35px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.4s; position: relative; overflow: hidden; background: var(--dark-2); border: 1px solid rgba(255,255,255,0.1); color: #fff; }
        .s-btn.insta:hover { border-color: #e1306c; box-shadow: 0 0 20px rgba(225,48,108,0.3); }
        .s-btn.tele:hover { border-color: #0088cc; box-shadow: 0 0 20px rgba(0,136,204,0.3); }

        /* گالری پابجی خفن */
        .gallery-title { text-align: center; margin-top: 50px; color: var(--main); letter-spacing: 2px; font-size: 0.9rem; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; padding: 30px 5%; }
        .g-card { height: 220px; border-radius: 15px; overflow: hidden; border: 1px solid #222; position: relative; }
        .g-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; filter: brightness(60%) sepia(20%); }
        .g-card:hover img { transform: scale(1.15) rotate(2deg); filter: brightness(100%) sepia(0%); }
        .g-card::after { content: 'AMIR ASHJAEE'; position: absolute; bottom: 15px; right: 15px; font-size: 0.7rem; color: var(--main); opacity: 0.7; }

        footer { padding: 60px 20px; text-align: center; background: #050505; border-top: 1px solid #111; }
        .dev-by { font-size: 0.9rem; color: #555; }
        .dev-by span { color: var(--main); font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="acc-id">5737064866</div>
        <div class="profile">
            <div style="text-align:left;">
                <div style="font-weight:bold; color:#fff; font-size:1rem;">Amir Mohammad Ashjaee</div>
                <div dir="rtl" style="font-size:0.75rem; color:#888;">امیر محمد اشجعی</div>
            </div>
            <!-- عکس پروفایلت که از قبل داشتی -->
            <img src="https://user-images.githubusercontent.com/amirmohemmed6/pubg-pro-dev/main/amir_ashjaee_profile.jpg" class="avatar" alt="Amir">
        </div>
    </nav>

    <main class="hero">
        <div class="status"><div class="dot"></div> System Active | Online</div>
        <h1>AMIR PRO</h1>
        <div class="name-farsi">امیر محمد اشجعی</div>
        
        <div class="social-btns">
            <a href="https://instagram.com/_amir_ash0" class="s-btn insta">Instagram</a>
            <a href="https://t.me/amir" class="s-btn tele">Telegram</a>
        </div>
    </main>

    <div class="gallery-title">PUBG MOBILE RECENT ACTIVITY</div>
    <div class="gallery">
        <div class="g-card"><img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800"></div>
        <div class="g-card"><img src="https://images.unsplash.com/photo-1593305841991-05c297ba4575?q=80&w=800"></div>
        <div class="g-card"><img src="https://images.unsplash.com/photo-1552824734-fa6d7e98d975?q=80&w=800"></div>
    </div>

    <footer>
        <div class="dev-by">Designed & Developed by <span>Amir Mohammad Ashjaee</span></div>
        <p style="font-size:0.7rem; color:#333; margin-top:10px;">© 2026 - Powered by HONOR X8 5G Technology</p>
    </footer>

</body>
</html>
