<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir | Private Space</title>
    <style>
        :root {
            --accent: #ffffff;
            --bg: #080808;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* لایه نوری پس‌زمینه (Shadowy Aesthetic) */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 40px; /* مدل اشکی مدرن */
            object-fit: cover;
            filter: grayscale(1) contrast(1.1); /* استایل سیاه و سفید باکلاس */
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .tagline {
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .bio-section {
            font-size: 0.9rem;
            color: #999;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-decoration: none;
            color: #ccc;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .link-card:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.03);
        }

        .link-info span {
            display: block;
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.6rem;
            color: #333;
            letter-spacing: 3px;
        }

    </style>
</head>
<body>

    <div class="spotlight" id="spot"></div>

    <div class="container">
        <div class="profile-wrapper">
            <!-- جای این عکس می‌تونی لینک یکی از ادیت‌های تاریک خودت رو بذاری -->
            <img src="https://via.placeholder.com/300/080808/ffffff?text=AMIR" alt="Amir" class="profile-img">
        </div>

        <h1>AMIR</h1>
        <p class="tagline">CREATIVE ARCHITECT</p>

        <div class="bio-section">
            تمرکز بر کیفیت، حرکت در سایه‌ها.<br>
            جایی که استایل با تکنولوژی ملاقات می‌کند.
        </div>

        <div class="links-grid">
            <!-- لینک اینستاگرام اصلاح شده -->
            <a href="https://instagram.com/_amir_ash0" class="link-card">
                <div class="link-info">
                    <span>Social Media</span>
                    <strong>Instagram</strong>
                </div>
                <div class="arrow">↗</div>
            </a>

            <!-- لینک تلگرام -->
            <a href="https://t.me/amir" class="link-card">
                <div class="link-info">
                    <span>Direct Message</span>
                    <strong>Telegram</strong>
                </div>
                <div class="arrow">↗</div>
            </a>

            <!-- شماره تماس اضافه شده -->
            <a href="tel:09938426581" class="link-card">
                <div class="link-info">
                    <span>Mobile Number</span>
                    <strong>0993 842 6581</strong>
                </div>
                <div class="arrow">📞</div>
            </a>
        </div>

        <div class="footer">
            EST. 2026 | ALL RIGHTS RESERVED
        </div>
    </div>

    <script>
        // افکت حرکت نور با موس (باکلاس کردن محیط)
        const spot = document.getElementById('spot');
        document.body.addEventListener('mousemove', e => {
            spot.style.setProperty('--x', e.clientX + 'px');
            spot.style.setProperty('--y', e.clientY + 'px');
        });
    </script>
</body>
</html>
